name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so the whitespace gate below can resolve a merge base
          # against the PR's base branch. A shallow clone has none, and
          # `git diff --check` with no range compares the working tree to the
          # index -- always empty after checkout, so it would always pass.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install package
        run: python -m pip install -e .
      - name: Static analysis (ruff)
        if: matrix.python-version == '3.11'
        run: uv run --group lint ruff check src tests tools packaging
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Compile package
        run: python -m compileall src
      - name: Generated workflow docs check
        run: python -m omh.cli docs workflows --check
      - name: Generated role docs check
        run: python -m omh.cli docs roles --check
      - name: Generated capability families check
        run: python -m omh.cli docs capability-families --check
      - name: Generated ULW README region check
        run: python -m omh.cli docs ulw-inventory --check
      - name: Generated ULW site region check
        run: python -m omh.cli docs ulw-site --check
      - name: Whitespace and conflict-marker check
        if: matrix.python-version == '3.11' && github.event_name == 'pull_request'
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
      - name: Dry-run install smoke
        run: python -m omh.cli --omh-home /tmp/omh-smoke --hermes-home /tmp/hermes-smoke install --dry-run
      - name: Stable-channel dry-run smoke
        run: python -m omh.cli --omh-home /tmp/omh-smoke --hermes-home /tmp/hermes-smoke install --dry-run --channel stable --version 0.1.0
      - name: Capability probe smoke
        run: python -m omh.cli --omh-home /tmp/omh-smoke --hermes-home /tmp/hermes-smoke probe
      - name: Hermes release smoke plan
        run: python -m omh.cli release hermes-smoke
      - name: Release readiness checklist
        run: python -m omh.cli release checklist --json
      - name: Installed OMH command smoke
        run: |
          omh --help
          omh --omh-home /tmp/omh-smoke --hermes-home /tmp/hermes-smoke release hermes-smoke --install-path setup --omh-command omh --include-command-smoke
      - name: Runtime artifact smoke
        run: |
          run_json="$(python -m omh.cli --omh-home /tmp/omh-smoke --hermes-home /tmp/hermes-smoke runtime record --skill oh-my-hermes --harness coding-handling --status started)"
          run_id="$(printf '%s' "$run_json" | python -c 'import json,sys; print(json.load(sys.stdin)["run"]["run_id"])')"
          python -m omh.cli --omh-home /tmp/omh-smoke --hermes-home /tmp/hermes-smoke runtime delegate --run "$run_id" --requested --not-observed --result not_observed
          python -m omh.cli --omh-home /tmp/omh-smoke --hermes-home /tmp/hermes-smoke runtime wrapper --run "$run_id" --prompt-dispatched --response-observed --completion-status completed
          python -m omh.cli --omh-home /tmp/omh-smoke --hermes-home /tmp/hermes-smoke runtime validate --run "$run_id"
          python -m omh.cli --omh-home /tmp/omh-smoke --hermes-home /tmp/hermes-smoke runtime export --redacted
          python -m omh.cli --omh-home /tmp/omh-smoke --hermes-home /tmp/hermes-smoke runtime show "$run_id"
          python -m omh.cli --omh-home /tmp/omh-smoke --hermes-home /tmp/hermes-smoke runtime runs

  test-windows:
    # The ubuntu matrix above cannot observe Windows-only behavior: the
    # platform guards from #771/#778, drive-letter and path-separator
    # handling, and byte-stable managed-file writes. Since #781 made the
    # suite Windows-green, the full suite runs here as an enforcing gate;
    # POSIX-only surfaces skip through the tests/_platform_support guards.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install package
        run: python -m pip install -e .
      - name: Unit tests (full suite)
        env:
          PYTHONPATH: tests
        run: python -m unittest discover -s tests
      - name: Compile package
        run: python -m compileall src
      # install.ps1 cannot be parsed or executed anywhere else, so its only
      # oracle is this job. Parse first for a precise syntax error, then run it
      # end to end against the checkout and prove the round trip: the shim it
      # writes must run, and `omh uninstall` must recognize that shim as its
      # own -- the failure #848 would otherwise reintroduce.
      # Both hosts, because they hide each other's bugs: 5.1 is the stated
      # target and the reason for the ASCII-only and no-VT constraints, while 7
      # is stricter about native argument passing. A parse error in either is a
      # broken installer for somebody.
      - name: Windows installer syntax (PowerShell 7)
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1).ProviderPath, [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object {
              Write-Error "install.ps1($($_.Extent.StartLineNumber),$($_.Extent.StartColumnNumber)): $($_.Message)"
            }
            exit 1
          }
          Write-Host "install.ps1 parsed clean on $($PSVersionTable.PSVersion)"
      - name: Windows installer syntax (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1).ProviderPath, [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object {
              Write-Error "install.ps1($($_.Extent.StartLineNumber),$($_.Extent.StartColumnNumber)): $($_.Message)"
            }
            exit 1
          }
          Write-Host "install.ps1 parsed clean on $($PSVersionTable.PSVersion)"
      - name: Windows installer end-to-end
        shell: pwsh
        env:
          OMH_CHANNEL: local
          OMH_ADD_TO_PATH: '0'
          OMH_RUN_SETUP: '0'
          # Pin the interpreter to the one setup-python installed. Left to its
          # own discovery order the installer would prefer the `py` launcher,
          # which points at the image's bundled Python, not this job's.
          OMH_PYTHON: python
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'omh-install-smoke'
          $env:OMH_PACKAGE_URL = (Get-Location).Path
          $env:OMH_VENV_DIR = Join-Path $work 'venv'
          $env:OMH_BIN_DIR = Join-Path $work 'bin'
          ./install.ps1
          # A script's `exit 1` sets $LASTEXITCODE without failing the step, so
          # without this a pip failure would be reported as a missing shim.
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 exited $LASTEXITCODE" }
          $shim = Join-Path $env:OMH_BIN_DIR 'omh.cmd'
          if (-not (Test-Path $shim)) { throw "installer did not write $shim" }
          & $shim --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'omh.cmd shim did not run' }
      - name: Windows managed-command round trip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'omh-install-smoke'
          $env:OMH_VENV_DIR = Join-Path $work 'venv'
          $env:OMH_BIN_DIR = Join-Path $work 'bin'
          $homes = @('--omh-home', (Join-Path $work 'omh-home'), '--hermes-home', (Join-Path $work 'hermes-home'))
          $shim = Join-Path $env:OMH_BIN_DIR 'omh.cmd'
          & $shim @homes setup | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'omh setup failed from the installed shim' }
          $preview = & $shim @homes uninstall --dry-run --json | ConvertFrom-Json
          if ($preview.command_package.status -ne 'would_remove') {
            throw "uninstall did not recognize the installer-managed command: $($preview.command_package | ConvertTo-Json -Compress)"
          }
          Write-Host 'installer-managed command recognized on Windows'
      # The steps above pin OMH_VENV_DIR/OMH_BIN_DIR and OMH_ADD_TO_PATH, which
      # skips exactly the code a real `irm | iex` user runs: the %LOCALAPPDATA%
      # defaults and the user-PATH edit. Run once with neither set. The registry
      # assertion is the point -- writing PATH back through
      # [Environment]::SetEnvironmentVariable would silently turn it from
      # REG_EXPAND_SZ to REG_SZ and flatten every %VAR% entry on the machine.
      - name: Windows installer default locations and PATH
        shell: pwsh
        env:
          OMH_CHANNEL: local
          OMH_PYTHON: python
        run: |
          $ErrorActionPreference = 'Stop'
          $before = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment')
          $beforeKind = if ($before -and $before.GetValue('Path')) { $before.GetValueKind('Path') } else { 'ExpandString' }
          $env:OMH_PACKAGE_URL = (Get-Location).Path
          ./install.ps1
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 exited $LASTEXITCODE" }
          $shim = Join-Path $env:LOCALAPPDATA 'omh\bin\omh.cmd'
          if (-not (Test-Path $shim)) { throw "installer did not use the %LOCALAPPDATA% default: $shim missing" }
          $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment')
          if ($key.GetValueKind('Path') -ne 'ExpandString') {
            throw "installer flattened the user PATH from $beforeKind to $($key.GetValueKind('Path'))"
          }
          $stored = $key.GetValue('Path', '', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
          if ($stored -notlike '*omh\bin*') { throw 'installer did not add its bin dir to the user PATH' }
          Write-Host 'default locations and user PATH edit verified'

  distribution:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Build and install exact npm and Bun artifacts
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          root="$PWD/dist/distribution"
          wheel_dir="$root/python"
          package_dir="$root/npm"
          tarball_dir="$root/npm-tarball"
          uv build --wheel --out-dir "$wheel_dir"
          wheel="$(find "$wheel_dir" -name '*.whl' -print -quit)"
          version="$(uv run tools/package_manager/metadata.py --version)"
          uv run tools/package_manager/stage_npm.py \
            --wheel "$wheel" \
            --output "$package_dir"
          npm publish --dry-run "$package_dir"
          mkdir -p "$tarball_dir"
          npm pack --pack-destination "$tarball_dir" "$package_dir" >/dev/null
          tarball="$tarball_dir/oh-my-hermes-$version.tgz"

          npm_prefix="$RUNNER_TEMP/omh-npm"
          npm install --global --ignore-scripts --prefix "$npm_prefix" "$tarball"
          OMH_CACHE_DIR="$RUNNER_TEMP/omh-npm-cache" \
            OMH_PYTHON=python \
            "$npm_prefix/bin/omh" --version

          export BUN_INSTALL="$RUNNER_TEMP/omh-bun"
          bun install --global "$tarball"
          OMH_CACHE_DIR="$RUNNER_TEMP/omh-bun-cache" \
            OMH_PYTHON=python \
            "$BUN_INSTALL/bin/omh" --version
      - name: Install and test local Homebrew formula
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find "$PWD/dist/distribution/python" -name '*.whl' -print -quit)"
          version="$(uv run tools/package_manager/metadata.py --version)"
          formula="$RUNNER_TEMP/omh.rb"
          uv run tools/package_manager/render_homebrew.py \
            --version "$version" \
            --wheel "$wheel" \
            --output "$formula"
          ruby -c "$formula"
          brew style "$formula"
          brew tap-new --no-git omh/local-qa
          tap="$(brew --repository omh/local-qa)"
          mkdir -p "$tap/Formula"
          cp "$formula" "$tap/Formula/omh.rb"
          brew install omh/local-qa/omh
          brew test omh/local-qa/omh
          "$(brew --prefix omh)/bin/omh" --version
          brew uninstall omh
          brew untap --force omh/local-qa
          brew developer off
      - name: Clean distribution QA state
        if: always()
        shell: bash
        run: |
          if command -v brew >/dev/null 2>&1; then
            brew uninstall --force omh >/dev/null 2>&1 || true
            brew untap --force omh/local-qa >/dev/null 2>&1 || true
            brew developer off >/dev/null 2>&1 || true
          fi
          rm -rf \
            "$RUNNER_TEMP/omh-npm" \
            "$RUNNER_TEMP/omh-npm-cache" \
            "$RUNNER_TEMP/omh-bun" \
            "$RUNNER_TEMP/omh-bun-cache" \
            "$RUNNER_TEMP/omh.rb"
