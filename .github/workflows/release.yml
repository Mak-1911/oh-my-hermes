name: Distribution Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to resume
        required: true
        type: string

concurrency:
  group: distribution-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: write
      id-token: write
    runs-on: macos-latest
    environment: npm
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.14.0"
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install trusted-publishing npm CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.5.1
          test "$(npm --version)" = "11.5.1"

      - name: Validate tag and distribution contracts
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          test "$tag_commit" = "$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$tag_commit" origin/main
          test "$tag_commit" = "$(git rev-parse origin/main)"
          source_date_epoch="$(git show -s --format=%ct "$tag_commit")"
          echo "SOURCE_DATE_EPOCH=$source_date_epoch" >> "$GITHUB_ENV"
          version="$(uv run tools/package_manager/metadata.py --version)"
          test "$RELEASE_TAG" = "v$version"
          PYTHONPATH=tests uv run python -m unittest \
            tests.test_distribution_packages \
            tests.test_homebrew_distribution \
            tests.test_distribution_surfaces

      - name: Build one immutable wheel and npm tarball
        shell: bash
        run: |
          set -euo pipefail
          root="$PWD/dist/release"
          wheel_dir="$root/python"
          package_dir="$root/npm"
          tarball_dir="$root/npm-tarball"
          version="$(uv run tools/package_manager/metadata.py --version)"
          uv build --wheel --out-dir "$wheel_dir"
          wheel="$(find "$wheel_dir" -name '*.whl' -print -quit)"
          uv run tools/package_manager/metadata.py --wheel "$wheel" --json
          uv run tools/package_manager/stage_npm.py \
            --wheel "$wheel" \
            --output "$package_dir"
          npm publish --dry-run "$package_dir"
          mkdir -p "$tarball_dir"
          npm pack --pack-destination "$tarball_dir" "$package_dir" >/dev/null
          tarball="$tarball_dir/oh-my-hermes-$version.tgz"
          sha256="$(shasum -a 256 "$wheel" | cut -d ' ' -f 1)"
          {
            echo "OMH_VERSION=$version"
            echo "OMH_WHEEL=$wheel"
            echo "OMH_WHEEL_SHA256=$sha256"
            echo "OMH_TARBALL=$tarball"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: rlaope/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: dist/release/homebrew-tap

      - name: Preflight npm and Homebrew destinations
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          package_name="$(npm view oh-my-hermes name --json | tr -d '"')"
          test "$package_name" = "oh-my-hermes"
          npm owner ls oh-my-hermes --json |
            uv run tools/package_manager/metadata.py \
              --require-npm-owner rlaope
          tap="$PWD/dist/release/homebrew-tap"
          test -d "$tap/.git"
          git -C "$tap" push --dry-run origin HEAD:refs/heads/main

      - name: Create or verify immutable GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          asset="$(basename "$OMH_WHEEL")"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            asset_count="$(
              gh release view "$RELEASE_TAG" \
                --json assets \
                --jq "[.assets[] | select(.name == \"$asset\")] | length"
            )"
            if [ "$asset_count" = 0 ]; then
              gh release upload "$RELEASE_TAG" \
                "$OMH_WHEEL#Python wheel"
            else
              test "$asset_count" = 1
            fi
          else
            gh release create "$RELEASE_TAG" \
              "$OMH_WHEEL#Python wheel" \
              --verify-tag \
              --generate-notes \
              --title "$RELEASE_TAG"
          fi

      - name: Verify immutable release wheel
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          verified="$RUNNER_TEMP/verified-release"
          mkdir -p "$verified"
          gh release download "$RELEASE_TAG" \
            --pattern "$(basename "$OMH_WHEEL")" \
            --dir "$verified"
          release_wheel="$verified/$(basename "$OMH_WHEEL")"
          cmp "$OMH_WHEEL" "$release_wheel"
          release_sha256="$(shasum -a 256 "$release_wheel" | cut -d ' ' -f 1)"
          test "$release_sha256" = "$OMH_WHEEL_SHA256"
          echo "OMH_RELEASE_SHA256=$release_sha256" >> "$GITHUB_ENV"

      - name: Publish or verify npm package
        shell: bash
        run: |
          set -euo pipefail
          local_integrity="sha512-$(openssl dgst -sha512 -binary "$OMH_TARBALL" | openssl base64 -A)"
          published_integrity="$(
            npm view "oh-my-hermes@$OMH_VERSION" dist.integrity --json 2>/dev/null |
              tr -d '"' || true
          )"
          if [ -n "$published_integrity" ]; then
            test "$published_integrity" = "$local_integrity"
          else
            npm publish "$OMH_TARBALL" --access public --provenance
          fi

      - name: Render verified Homebrew formula
        shell: bash
        run: |
          set -euo pipefail
          release_url="https://github.com/rlaope/oh-my-hermes/releases/download/$RELEASE_TAG/$(basename "$OMH_WHEEL")"
          uv run tools/package_manager/render_homebrew.py \
            --version "$OMH_VERSION" \
            --url "$release_url" \
            --sha256 "$OMH_RELEASE_SHA256" \
            --output "$RUNNER_TEMP/omh.rb"
          ruby -c "$RUNNER_TEMP/omh.rb"

      - name: Publish or verify Homebrew tap formula
        shell: bash
        run: |
          set -euo pipefail
          tap="$PWD/dist/release/homebrew-tap"
          mkdir -p "$tap/Formula"
          formula="$tap/Formula/omh.rb"
          brew style "$RUNNER_TEMP/omh.rb"
          if [ -f "$formula" ]; then
            existing_version="$(
              ruby -ne 'puts Regexp.last_match(1) if $_ =~ /^\s*version "([0-9]+\.[0-9]+\.[0-9]+)"$/' "$formula"
            )"
            test -n "$existing_version"
            version_order="$(
              uv run tools/package_manager/metadata.py --compare-versions "$existing_version" "$OMH_VERSION"
            )"
            test "$version_order" -le 0
            if [ "$version_order" -eq 0 ]; then
              cmp "$RUNNER_TEMP/omh.rb" "$tap/Formula/omh.rb"
              exit 0
            fi
          fi
          cp "$RUNNER_TEMP/omh.rb" "$formula"
          brew style "$formula"
          if [ -z "$(git -C "$tap" status --porcelain -- Formula/omh.rb)" ]; then
            exit 0
          fi
          git -C "$tap" config user.name "github-actions[bot]"
          git -C "$tap" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$tap" add Formula/omh.rb
          git -C "$tap" commit -s -m "chore: update omh formula to $OMH_VERSION"
          git -C "$tap" push
